name: Build City Freedom Makkah Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project and check scripts
        run: godot --headless --editor --path . --quit
      - name: Build Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/CityFreedom-Makkah.apk
          test -s build/CityFreedom-Makkah.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityFreedom-Makkah-Android-APK
          path: build/CityFreedom-Makkah.apk
          if-no-files-found: error
